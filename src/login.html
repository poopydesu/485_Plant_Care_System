<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Megan Warren">
    <meta name="author" content="Rachal Thornton">
    <title>Plant Care Login</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script>
        if (new URLSearchParams(window.location.search).get('login') === 'failed') {
            alert('Invalid username or password.');
        }
    </script>
</head>

<body id="login">
    <!-- Nav bar to hold login, view plants, and about us buttons -->
     <nav>
        <!-- Logo/favicon in top left with placeholder name -->
        <a href="index.html"><img src="assets/favicon.png" alt="Site Logo" width="40" height="40"><span class="logo-text">Plant Care System</span></a>

        <!-- Form to allow PHP POST method -->
        <form method="POST" action="index.php">
            <button type="submit" class="nav-btn" name="index-btn-home">Home</button>
            <button type="submit" class="nav-btn" name="index-btn-plants">View Plants</button>
            <button type="submit" class="nav-btn" name="index-btn-about">About Us</button>
        </form>
        
     </nav>

    <div class = "main-body">
        <!-- Container to keep UI separate from background -->
        <div class="container">
            <h1>Login</h1>

            <!-- Login form -->
            <form action="login.php" method="POST">
                <label for="username">Username:</label>
                <div class="input-box">
                    <input type="text" id="username" name="username" required><br>
                    <i class='bx bxs-user'></i>
                </div>

                <label for="password">Password:</label>
                <div class="input-box">
                    <input type = "text" id="password" name="password" required><br>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                
                <input type="submit" name = "Login" value="Submit" class="submit-btn">
            </form>
        </div>
    </div>
</body>
</html>
